name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: zeus
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            binary: zeus.exe
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set names
        id: names
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "archive=zeus_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive_ext }}" >> $GITHUB_OUTPUT
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build \
            -ldflags "-X github.com/smitt14ua/zeus/cmd.version=${{ steps.names.outputs.version }}" \
            -o ${{ matrix.binary }} .
      - name: Pack
        run: |
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar czf ${{ steps.names.outputs.archive }} ${{ matrix.binary }}
          else
            zip ${{ steps.names.outputs.archive }} ${{ matrix.binary }}
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.names.outputs.archive }}
