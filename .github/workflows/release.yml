name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: zeus-linux-amd64
          - goos: windows
            goarch: amd64
            output: zeus-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -ldflags "-X github.com/smitt14ua/zeus/cmd.version=${VERSION}" -o ${{ matrix.output }} .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output }}
