name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: zeus version
      description: Output of `zeus --version`
      placeholder: "0.1.6"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - Linux arm64
        - macOS x86_64
        - macOS arm64 (Apple Silicon)
        - Windows x86_64
        - Other
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - install.sh
        - install.ps1
        - go install
        - Built from source
        - Manual binary download
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create profile with `zeus add ...`
        2. Run `zeus start ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: profile
    attributes:
      label: Profile YAML (if relevant)
      description: Paste your profile — remove sensitive values (passwords, keys).
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
